pseudo_labels:
  'NO':
    description: Nuclear Opalescence - correlated with blur
    metrics:
    - name: laplacian_var
      relation: inverse
      weight: 1.0
    clamp_range:
    - 0
    - 5
  NC:
    description: Nuclear Color - correlated with yellowing
    metrics:
    - name: red_blue_ratio
      relation: direct
      weight: 0.7
    - name: mean_luminance
      relation: inverse
      weight: 0.3
    clamp_range:
    - 0
    - 5
  CO:
    description: Cortical - correlated with edge features
    metrics:
    - name: edge_density
      relation: direct
      weight: 1.0
    clamp_range:
    - 0
    - 5
  PSC:
    description: Posterior Subcapsular - correlated with contrast loss/glare
    metrics:
    - name: contrast
      relation: inverse
      weight: 0.6
    - name: mean_luminance
      relation: direct
      weight: 0.4
    clamp_range:
    - 0
    - 5
