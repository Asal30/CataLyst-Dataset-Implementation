pseudo_labels:
  "NO":
    description: "Nuclear Opalescence - correlated with blur"
    metrics:
      - name: "laplacian_var"
        relation: "inverse" # Lower variance = Higher NO
        weight: 1.0
    clamp_range: [0, 5]

  NC:
    description: "Nuclear Color - correlated with yellowing"
    metrics:
      - name: "red_blue_ratio"
        relation: "direct" # Higher R/B ratio = Higher NC (more yellow)
        weight: 0.7
      - name: "mean_luminance"
        relation: "inverse" # darkening
        weight: 0.3
    clamp_range: [0, 5]

  CO:
    description: "Cortical - correlated with edge features"
    metrics:
      - name: "edge_density"
        relation: "direct" # More edges = Higher CO (spokes)
        weight: 1.0
    clamp_range: [0, 5]

  PSC:
    description: "Posterior Subcapsular - correlated with contrast loss/glare"
    metrics:
      - name: "contrast"
        relation: "inverse" # Lower contrast = Higher PSC
        weight: 0.6
      - name: "mean_luminance"
        relation: "direct" # Central glare can increase local brightness (feature to be refined)
        weight: 0.4
    clamp_range: [0, 5]

bin_thresholds:
  0: 0.5
  1: 1.5
  2: 2.5
  3: 3.5
  4: 4.5
  # 5 is anything > 4.5
